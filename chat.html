<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Private Chat Workspace</title>
<style>
  :root{
    --bg:#ffffff;
    --panel:#f7f7f8;
    --border:#e5e7eb;
    --text:#111827;
    --muted:#6b7280;
    --accent:#111827;
    --bubble:#f3f4f6;
    --radius:18px;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background:var(--bg);
    color:var(--text);
    overflow:hidden;
  }
  .app{
    height:100vh;
    display:grid;
    grid-template-columns:260px 1fr;
  }
  .sidebar{
    border-right:1px solid var(--border);
    background:var(--panel);
    display:flex;
    flex-direction:column;
    min-width:0;
  }
  .sidebar-header{padding:14px}
  .new-chat{
    width:100%;
    border:1px solid var(--border);
    background:#fff;
    border-radius:12px;
    padding:11px 12px;
    font-weight:600;
    cursor:pointer;
    text-align:left;
  }
  .sidebar-list{
    padding:8px;
    overflow:auto;
    flex:1;
  }
  .chat-item{
    padding:10px 12px;
    border-radius:10px;
    cursor:pointer;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    font-size:14px;
  }
  .chat-item:hover,.chat-item.active{background:#ececef}
  .sidebar-foot{
    padding:12px;
    border-top:1px solid var(--border);
    font-size:12px;
    color:var(--muted);
  }
  .main{
    min-width:0;
    display:flex;
    flex-direction:column;
    height:100vh;
  }
  .topbar{
    height:58px;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    flex:0 0 auto;
    background:#fff;
  }
  .brand{font-weight:700}
  .topic{
    font-size:13px;
    color:var(--muted);
  }
  .messages{
    flex:1;
    overflow:auto;
    padding:28px 18px 160px;
    scroll-behavior:smooth;
  }
  .thread{
    max-width:820px;
    margin:0 auto;
  }
  .welcome{
    padding:40px 8px;
    text-align:center;
    color:var(--muted);
  }
  .msg{
    margin:18px 0;
    display:flex;
  }
  .msg.user{justify-content:flex-end}
  .bubble{
    max-width:min(78%,720px);
    white-space:pre-wrap;
    word-break:break-word;
    line-height:1.55;
    font-size:15px;
  }
  .user .bubble{
    background:var(--bubble);
    padding:11px 14px;
    border-radius:18px 18px 4px 18px;
  }
  .assistant .bubble{
    width:100%;
    padding:2px 2px;
  }
  .files{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:8px;
  }
  .file-pill{
    border:1px solid var(--border);
    background:#fff;
    border-radius:12px;
    padding:8px 10px;
    font-size:12px;
    display:flex;
    gap:8px;
    align-items:center;
    max-width:240px;
  }
  .file-name{
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .composer-wrap{
    position:absolute;
    left:260px;
    right:0;
    bottom:0;
    padding:0 18px 18px;
    background:linear-gradient(to top, #fff 72%, rgba(255,255,255,0));
    pointer-events:none;
  }
  .composer{
    pointer-events:auto;
    max-width:820px;
    margin:0 auto;
    border:1px solid var(--border);
    border-radius:22px;
    background:#fff;
    box-shadow:0 6px 30px rgba(0,0,0,.08);
    padding:10px;
  }
  .attachment-bar{
    display:none;
    flex-wrap:wrap;
    gap:8px;
    padding:2px 4px 10px;
  }
  .attachment-bar.show{display:flex}
  .attachment-card{
    border:1px solid var(--border);
    border-radius:10px;
    padding:7px 9px;
    font-size:12px;
    display:flex;
    align-items:center;
    gap:8px;
    background:#fafafa;
    max-width:240px;
  }
  .remove{
    border:0;
    background:transparent;
    cursor:pointer;
    color:var(--muted);
    font-size:14px;
  }
  textarea{
    width:100%;
    min-height:54px;
    max-height:260px;
    resize:none;
    border:0;
    outline:0;
    padding:10px 10px 4px;
    font:inherit;
    line-height:1.45;
    background:transparent;
  }
  .actions{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:5px 4px 2px;
  }
  .left-actions{display:flex;gap:6px}
  .icon-btn{
    border:1px solid var(--border);
    background:#fff;
    border-radius:999px;
    width:38px;
    height:38px;
    cursor:pointer;
    font-size:18px;
  }
  .send{
    border:0;
    background:var(--accent);
    color:#fff;
    border-radius:999px;
    min-width:74px;
    height:38px;
    padding:0 16px;
    cursor:pointer;
    font-weight:700;
  }
  .send:disabled{opacity:.35;cursor:not-allowed}
  .hint{
    text-align:center;
    color:var(--muted);
    font-size:11px;
    padding-top:8px;
  }
  .drop-overlay{
    position:fixed;
    inset:0;
    background:rgba(255,255,255,.9);
    display:none;
    place-items:center;
    z-index:50;
    border:4px dashed #9ca3af;
    font-size:22px;
    font-weight:700;
  }
  .drop-overlay.show{display:grid}
  .mobile-menu{display:none}
  @media(max-width:800px){
    .app{grid-template-columns:1fr}
    .sidebar{
      position:fixed;
      inset:0 auto 0 0;
      width:280px;
      z-index:40;
      transform:translateX(-100%);
      transition:.2s ease;
      box-shadow:0 0 30px rgba(0,0,0,.15);
    }
    .sidebar.open{transform:translateX(0)}
    .composer-wrap{left:0}
    .mobile-menu{display:inline-flex}
    .topbar{padding-left:10px}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <button class="new-chat" id="newChatBtn">＋ New chat</button>
    </div>
    <div class="sidebar-list" id="chatList"></div>
    <div class="sidebar-foot">
      Local browser prototype<br>
      Messages stay on this device unless you add a backend.
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:10px">
        <button class="icon-btn mobile-menu" id="menuBtn">☰</button>
        <div>
          <div class="brand">Private Chat</div>
          <div class="topic">One-to-one topic workspace</div>
        </div>
      </div>
      <button class="icon-btn" id="clearBtn" title="Clear current chat">⌫</button>
    </div>

    <section class="messages" id="messages">
      <div class="thread" id="thread"></div>
    </section>

    <div class="composer-wrap">
      <div class="composer">
        <div class="attachment-bar" id="attachmentBar"></div>
        <textarea id="input" placeholder="Message, paste long text, or drop files here..." spellcheck="true"></textarea>
        <div class="actions">
          <div class="left-actions">
            <button class="icon-btn" id="fileBtn" title="Add files">📎</button>
            <button class="icon-btn" id="folderBtn" title="Add folder">📁</button>
          </div>
          <button class="send" id="sendBtn" disabled>Send</button>
        </div>
      </div>
      <div class="hint">Enter to send · Shift+Enter for a new line · drag & drop files anywhere</div>
    </div>
  </main>
</div>

<div class="drop-overlay" id="dropOverlay">Drop files or folders here</div>

<input id="fileInput" type="file" multiple hidden />
<input id="folderInput" type="file" webkitdirectory directory multiple hidden />

<script>
(() => {
  const $ = s => document.querySelector(s);
  const thread = $("#thread");
  const messages = $("#messages");
  const input = $("#input");
  const sendBtn = $("#sendBtn");
  const fileInput = $("#fileInput");
  const folderInput = $("#folderInput");
  const attachmentBar = $("#attachmentBar");
  const dropOverlay = $("#dropOverlay");
  const chatList = $("#chatList");
  const sidebar = $("#sidebar");

  let attachments = [];
  let chats = JSON.parse(localStorage.getItem("private_chat_chats") || "[]");
  let activeId = localStorage.getItem("private_chat_active") || null;

  function uid(){ return crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random(); }
  function save(){
    localStorage.setItem("private_chat_chats", JSON.stringify(chats));
    if(activeId) localStorage.setItem("private_chat_active", activeId);
  }
  function current(){
    return chats.find(c => c.id === activeId);
  }
  function ensureChat(){
    if(!current()){
      const c = {id:uid(), title:"New chat", messages:[]};
      chats.unshift(c);
      activeId = c.id;
      save();
    }
  }
  function esc(s){
    return s.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
  }
  function humanSize(n){
    if(n < 1024) return n+" B";
    if(n < 1024*1024) return (n/1024).toFixed(1)+" KB";
    if(n < 1024*1024*1024) return (n/1024/1024).toFixed(1)+" MB";
    return (n/1024/1024/1024).toFixed(1)+" GB";
  }
  function renderChats(){
    chatList.innerHTML = chats.map(c =>
      `<div class="chat-item ${c.id===activeId?'active':''}" data-id="${c.id}">${esc(c.title || "New chat")}</div>`
    ).join("");
    chatList.querySelectorAll(".chat-item").forEach(el => {
      el.onclick = () => {
        activeId = el.dataset.id;
        save();
        renderAll();
        sidebar.classList.remove("open");
      };
    });
  }
  function renderThread(){
    ensureChat();
    const c = current();
    if(!c.messages.length){
      thread.innerHTML = `<div class="welcome">
        <h2 style="color:#111827;margin-bottom:8px">Start a conversation</h2>
        <div>Paste large text, attach multiple files, or add an entire folder.</div>
      </div>`;
      return;
    }
    thread.innerHTML = c.messages.map(m => {
      const fs = (m.files||[]).length ? `<div class="files">${
        m.files.map(f=>`<div class="file-pill">📄 <span class="file-name">${esc(f.path || f.name)}</span><span style="color:#9ca3af">${humanSize(f.size||0)}</span></div>`).join("")
      }</div>` : "";
      return `<div class="msg ${m.role}">
        <div class="bubble">${fs}${esc(m.text||"")}</div>
      </div>`;
    }).join("");
    requestAnimationFrame(() => messages.scrollTop = messages.scrollHeight);
  }
  function renderAttachments(){
    attachmentBar.classList.toggle("show", attachments.length > 0);
    attachmentBar.innerHTML = attachments.map((f,i) =>
      `<div class="attachment-card">📄 <span class="file-name">${esc(f.webkitRelativePath || f.name)}</span>
       <span style="color:#9ca3af">${humanSize(f.size)}</span>
       <button class="remove" data-i="${i}">×</button></div>`
    ).join("");
    attachmentBar.querySelectorAll(".remove").forEach(b => b.onclick = () => {
      attachments.splice(Number(b.dataset.i),1);
      renderAttachments();
      syncSend();
    });
  }
  function autoGrow(){
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight,260) + "px";
  }
  function syncSend(){
    sendBtn.disabled = !input.value.trim() && attachments.length===0;
  }
  function addFiles(fileList){
    for(const f of fileList){
      const key = (f.webkitRelativePath || f.name) + "::" + f.size + "::" + f.lastModified;
      if(!attachments.some(x => ((x.webkitRelativePath || x.name)+"::"+x.size+"::"+x.lastModified) === key)){
        attachments.push(f);
      }
    }
    renderAttachments();
    syncSend();
  }
  function send(){
    const text = input.value.trim();
    if(!text && !attachments.length) return;
    ensureChat();
    const c = current();
    const files = attachments.map(f => ({
      name:f.name,
      path:f.webkitRelativePath || f.name,
      size:f.size,
      type:f.type
    }));
    c.messages.push({role:"user", text, files, at:Date.now()});
    if(c.title==="New chat"){
      c.title = (text || (files[0]?.name || "Files")).slice(0,45);
    }
    input.value = "";
    attachments = [];
    autoGrow();
    renderAttachments();
    syncSend();

    // Demo assistant response. Replace this block with your API/backend call.
    setTimeout(() => {
      c.messages.push({
        role:"assistant",
        text: files.length
          ? `Received your message and ${files.length} attachment${files.length>1?'s':''}. This demo does not upload or read file contents yet. Connect your backend/API here.`
          : `Received: ${text}`,
        files:[],
        at:Date.now()
      });
      save();
      renderAll();
    }, 250);

    save();
    renderAll();
  }
  function renderAll(){
    renderChats();
    renderThread();
  }

  $("#newChatBtn").onclick = () => {
    const c = {id:uid(), title:"New chat", messages:[]};
    chats.unshift(c);
    activeId = c.id;
    save();
    renderAll();
  };

  $("#clearBtn").onclick = () => {
    const c = current();
    if(c && confirm("Clear this chat?")){
      c.messages = [];
      c.title = "New chat";
      save();
      renderAll();
    }
  };

  $("#fileBtn").onclick = () => fileInput.click();
  $("#folderBtn").onclick = () => folderInput.click();
  fileInput.onchange = e => { addFiles(e.target.files); e.target.value=""; };
  folderInput.onchange = e => { addFiles(e.target.files); e.target.value=""; };
  sendBtn.onclick = send;

  input.addEventListener("input", () => { autoGrow(); syncSend(); });
  input.addEventListener("keydown", e => {
    if(e.key==="Enter" && !e.shiftKey){
      e.preventDefault();
      send();
    }
  });

  // Keeps very large pasted text as plain text.
  input.addEventListener("paste", e => {
    if(e.clipboardData && e.clipboardData.types.includes("text/plain")){
      // Browser handles plain text paste normally.
    }
  });

  let dragDepth = 0;
  window.addEventListener("dragenter", e => {
    e.preventDefault();
    dragDepth++;
    dropOverlay.classList.add("show");
  });
  window.addEventListener("dragleave", e => {
    e.preventDefault();
    dragDepth--;
    if(dragDepth<=0){ dragDepth=0; dropOverlay.classList.remove("show"); }
  });
  window.addEventListener("dragover", e => e.preventDefault());
  window.addEventListener("drop", e => {
    e.preventDefault();
    dragDepth=0;
    dropOverlay.classList.remove("show");
    if(e.dataTransfer?.files?.length) addFiles(e.dataTransfer.files);
  });

  $("#menuBtn").onclick = () => sidebar.classList.toggle("open");
  document.addEventListener("click", e => {
    if(window.innerWidth<=800 && sidebar.classList.contains("open")
       && !sidebar.contains(e.target) && !$("#menuBtn").contains(e.target)){
      sidebar.classList.remove("open");
    }
  });

  ensureChat();
  renderAll();
  autoGrow();
  syncSend();
})();
</script>
</body>
</html>
