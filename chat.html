<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Desk Private Chat</title>
<style>
:root{
  --bg:#fff;--panel:#f7f7f8;--border:#e5e7eb;--text:#111827;
  --muted:#6b7280;--bubble:#f3f4f6;--accent:#111827;--danger:#b91c1c;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);background:var(--bg)}
button,input,textarea{font:inherit}
.hidden{display:none!important}

/* login */
.login-screen{
  min-height:100vh;display:grid;place-items:center;padding:24px;background:#fafafa
}
.login-card{
  width:min(420px,100%);background:#fff;border:1px solid var(--border);
  border-radius:20px;padding:28px;box-shadow:0 18px 50px rgba(0,0,0,.08)
}
.login-card h1{margin:0 0 8px;font-size:25px}
.login-card p{margin:0 0 22px;color:var(--muted);font-size:14px;line-height:1.5}
.field{margin:14px 0}
.field label{display:block;font-size:13px;font-weight:650;margin-bottom:7px}
.field input{
  width:100%;padding:12px 13px;border:1px solid var(--border);
  border-radius:12px;outline:none
}
.field input:focus{border-color:#9ca3af}
.login-btn{
  width:100%;margin-top:8px;border:0;border-radius:12px;padding:12px 14px;
  background:#111827;color:#fff;font-weight:700;cursor:pointer
}
.login-btn:disabled{opacity:.5;cursor:not-allowed}
.login-error{min-height:20px;margin-top:12px;color:var(--danger);font-size:13px}

/* app */
.app{height:100vh;display:grid;grid-template-columns:260px 1fr;overflow:hidden}
.sidebar{
  border-right:1px solid var(--border);background:var(--panel);
  display:flex;flex-direction:column;min-width:0
}
.side-head{padding:14px;border-bottom:1px solid var(--border)}
.side-title{font-weight:750}
.side-sub{font-size:12px;color:var(--muted);margin-top:3px}
.side-body{padding:12px;flex:1}
.status{
  border:1px solid var(--border);background:#fff;border-radius:12px;padding:12px;
  font-size:13px;line-height:1.5
}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#16a34a;margin-right:7px}
.side-foot{padding:12px;border-top:1px solid var(--border)}
.logout{
  width:100%;border:1px solid var(--border);background:#fff;border-radius:10px;
  padding:10px 12px;cursor:pointer;font-weight:650
}

.main{height:100vh;min-width:0;display:flex;flex-direction:column}
.topbar{
  height:60px;border-bottom:1px solid var(--border);display:flex;align-items:center;
  justify-content:space-between;padding:0 18px;flex:0 0 auto
}
.brand{font-weight:750}
.user-email{font-size:12px;color:var(--muted);max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.messages{flex:1;overflow:auto;padding:28px 18px 160px}
.thread{max-width:820px;margin:0 auto}
.welcome{text-align:center;color:var(--muted);padding:50px 12px}
.msg{display:flex;margin:18px 0}
.msg.mine{justify-content:flex-end}
.bubble{max-width:min(78%,720px);line-height:1.55;font-size:15px;white-space:pre-wrap;word-break:break-word}
.msg.mine .bubble{background:var(--bubble);padding:11px 14px;border-radius:18px 18px 4px 18px}
.msg.other .bubble{padding:2px 2px;width:100%}
.meta{font-size:11px;color:var(--muted);margin-top:5px}
.msg.mine .meta{text-align:right}

.composer-wrap{
  position:absolute;left:260px;right:0;bottom:0;padding:0 18px 18px;
  background:linear-gradient(to top,#fff 72%,rgba(255,255,255,0));pointer-events:none
}
.composer{
  pointer-events:auto;max-width:820px;margin:0 auto;border:1px solid var(--border);
  border-radius:22px;background:#fff;box-shadow:0 6px 30px rgba(0,0,0,.08);padding:10px
}
textarea{
  width:100%;min-height:56px;max-height:240px;resize:none;border:0;outline:0;
  padding:10px 10px 5px;background:transparent;line-height:1.45
}
.actions{display:flex;justify-content:space-between;align-items:center;padding:4px}
.attach-disabled{
  border:1px solid var(--border);background:#fafafa;color:#9ca3af;border-radius:999px;
  height:38px;padding:0 13px;cursor:not-allowed
}
.send{
  border:0;background:var(--accent);color:#fff;border-radius:999px;
  height:38px;padding:0 18px;font-weight:700;cursor:pointer
}
.send:disabled{opacity:.35;cursor:not-allowed}
.hint{text-align:center;color:var(--muted);font-size:11px;padding-top:8px}

.error-banner{
  display:none;max-width:820px;margin:12px auto 0;padding:10px 12px;
  border:1px solid #fecaca;background:#fef2f2;color:#991b1b;border-radius:10px;font-size:13px
}
.error-banner.show{display:block}

@media(max-width:800px){
  .app{grid-template-columns:1fr}
  .sidebar{display:none}
  .composer-wrap{left:0}
  .topbar{padding:0 12px}
}
</style>
</head>
<body>

<section class="login-screen" id="loginScreen">
  <div class="login-card">
    <h1>Private Chat</h1>
    <p>Sign in with the email and password created in Firebase Authentication.</p>
    <form id="loginForm">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="login-btn" id="loginBtn" type="submit">Sign in</button>
      <div class="login-error" id="loginError"></div>
    </form>
  </div>
</section>

<div class="app hidden" id="app">
  <aside class="sidebar">
    <div class="side-head">
      <div class="side-title">Desk Chat</div>
      <div class="side-sub">Firebase real-time workspace</div>
    </div>
    <div class="side-body">
      <div class="status"><span class="dot"></span><strong>Connected</strong><br>Messages are shared through Cloud Firestore.</div>
    </div>
    <div class="side-foot">
      <button class="logout" id="logoutBtn">Sign out</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="brand">Private Chat</div>
      <div class="user-email" id="userEmail"></div>
    </header>

    <div class="error-banner" id="errorBanner"></div>

    <section class="messages" id="messages">
      <div class="thread" id="thread">
        <div class="welcome">Loading messages…</div>
      </div>
    </section>

    <div class="composer-wrap">
      <div class="composer">
        <textarea id="messageInput" placeholder="Message…" spellcheck="true"></textarea>
        <div class="actions">
          <button class="attach-disabled" title="Cloud file storage is not configured yet" disabled>📎 Files soon</button>
          <button class="send" id="sendBtn" disabled>Send</button>
        </div>
      </div>
      <div class="hint">Enter to send · Shift+Enter for a new line · real-time across signed-in devices</div>
    </div>
  </main>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getAuth,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";
import {
  getFirestore,
  collection,
  addDoc,
  query,
  orderBy,
  onSnapshot,
  serverTimestamp,
  limit
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCynWwPx8dsTVAljJQCq4WsyFb1TPmM8cc",
  authDomain: "desk-chat-9c72e.firebaseapp.com",
  projectId: "desk-chat-9c72e",
  storageBucket: "desk-chat-9c72e.firebasestorage.app",
  messagingSenderId: "833171419379",
  appId: "1:833171419379:web:e58d84fe825ba16c954786",
  measurementId: "G-2BGB5PZLFT"
};

const firebaseApp = initializeApp(firebaseConfig);
const auth = getAuth(firebaseApp);
const db = getFirestore(firebaseApp);

const loginScreen = document.getElementById("loginScreen");
const appEl = document.getElementById("app");
const loginForm = document.getElementById("loginForm");
const loginBtn = document.getElementById("loginBtn");
const loginError = document.getElementById("loginError");
const logoutBtn = document.getElementById("logoutBtn");
const userEmail = document.getElementById("userEmail");
const thread = document.getElementById("thread");
const messagesEl = document.getElementById("messages");
const input = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");
const errorBanner = document.getElementById("errorBanner");

let unsubscribeMessages = null;

function escapeHtml(value=""){
  return String(value).replace(/[&<>"']/g, ch => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[ch]));
}

function showError(msg){
  errorBanner.textContent = msg;
  errorBanner.classList.toggle("show", !!msg);
}

function autoGrow(){
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight,240) + "px";
}

function formatTime(timestamp){
  if(!timestamp || !timestamp.toDate) return "";
  return timestamp.toDate().toLocaleString([], {
    year:"numeric",month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"
  });
}

function startMessages(user){
  if(unsubscribeMessages) unsubscribeMessages();

  const q = query(
    collection(db, "messages"),
    orderBy("createdAt", "asc"),
    limit(500)
  );

  unsubscribeMessages = onSnapshot(q, snapshot => {
    showError("");
    if(snapshot.empty){
      thread.innerHTML = '<div class="welcome"><h2 style="color:#111827;margin-bottom:8px">Start the conversation</h2><div>Send a message here, then open this same page on another computer and sign in.</div></div>';
      return;
    }

    thread.innerHTML = snapshot.docs.map(doc => {
      const m = doc.data();
      const mine = m.sender === user.uid;
      const who = mine ? "You" : (m.senderEmail || "Other user");
      return `
        <div class="msg ${mine ? "mine" : "other"}">
          <div class="bubble">
            ${escapeHtml(m.text || "")}
            <div class="meta">${escapeHtml(who)}${m.createdAt ? " · " + escapeHtml(formatTime(m.createdAt)) : ""}</div>
          </div>
        </div>`;
    }).join("");

    requestAnimationFrame(() => {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    });
  }, err => {
    console.error(err);
    showError("Could not read Firestore messages: " + err.message);
  });
}

async function sendMessage(){
  const text = input.value.trim();
  const user = auth.currentUser;
  if(!text || !user) return;

  sendBtn.disabled = true;
  showError("");

  try{
    await addDoc(collection(db, "messages"), {
      text,
      sender: user.uid,
      senderEmail: user.email || "",
      createdAt: serverTimestamp()
    });
    input.value = "";
    autoGrow();
  }catch(err){
    console.error(err);
    showError("Message failed to send: " + err.message);
  }finally{
    sendBtn.disabled = !input.value.trim();
    input.focus();
  }
}

loginForm.addEventListener("submit", async e => {
  e.preventDefault();
  loginError.textContent = "";
  loginBtn.disabled = true;
  loginBtn.textContent = "Signing in…";

  try{
    await signInWithEmailAndPassword(
      auth,
      document.getElementById("email").value.trim(),
      document.getElementById("password").value
    );
  }catch(err){
    console.error(err);
    loginError.textContent = "Sign-in failed. Check the email/password and make sure Email/Password is enabled in Firebase.";
  }finally{
    loginBtn.disabled = false;
    loginBtn.textContent = "Sign in";
  }
});

logoutBtn.addEventListener("click", async () => {
  await signOut(auth);
});

input.addEventListener("input", () => {
  autoGrow();
  sendBtn.disabled = !input.value.trim();
});

input.addEventListener("keydown", e => {
  if(e.key === "Enter" && !e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
});

sendBtn.addEventListener("click", sendMessage);

onAuthStateChanged(auth, user => {
  if(user){
    loginScreen.classList.add("hidden");
    appEl.classList.remove("hidden");
    userEmail.textContent = user.email || "Signed in";
    startMessages(user);
    input.focus();
  }else{
    if(unsubscribeMessages){
      unsubscribeMessages();
      unsubscribeMessages = null;
    }
    appEl.classList.add("hidden");
    loginScreen.classList.remove("hidden");
    thread.innerHTML = "";
    userEmail.textContent = "";
  }
});
</script>
</body>
</html>
